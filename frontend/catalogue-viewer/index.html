<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMF620 Consumer Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading { display: none; }
        .is-loading .loading { display: block; }
        .is-loading .content { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">
    <header class="bg-indigo-600 text-white p-4 shadow">
        <h1 class="text-xl font-bold">External BSS Consumer (TMF620)</h1>
        <p class="text-xs text-indigo-200 mt-1">This viewer strictly consumes TMF620 REST endpoints.</p>
    </header>

    <div class="container mx-auto p-4 flex gap-6 mt-4">
        
        <!-- Left Column: Offerings -->
        <div class="w-1/3 bg-white p-4 rounded shadow">
            <h2 class="font-bold text-lg border-b pb-2 mb-4">Product Offerings</h2>
            <div id="offerings-list" class="space-y-2">
                <div class="text-gray-500 italic">Loading offerings...</div>
            </div>
        </div>

        <!-- Right Column: Details & Pricing -->
        <div class="w-2/3 bg-white p-4 rounded shadow flex flex-col">
            <div id="selected-offering-panel" class="hidden">
                <h2 id="selected-title" class="font-bold text-2xl text-indigo-700 mb-2">Select an offering</h2>
                <div class="text-sm text-gray-500 mb-4 font-mono" id="selected-id"></div>
                
                <h3 class="font-bold text-lg border-b pb-2 mb-4 mt-6">Price Resolution Context</h3>
                <div class="grid grid-cols-3 gap-4 mb-4 bg-gray-50 p-4 rounded border">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Subscriber ID</label>
                        <input type="text" id="ctx-subscriber" class="w-full border rounded px-2 py-1 text-sm" placeholder="Optional...">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Account ID</label>
                        <input type="text" id="ctx-account" class="w-full border rounded px-2 py-1 text-sm" placeholder="Optional...">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Market ID</label>
                        <input type="text" id="ctx-market" class="w-full border rounded px-2 py-1 text-sm" placeholder="Optional...">
                    </div>
                    <div class="col-span-3">
                        <button onclick="fetchPrices()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1 px-4 rounded text-sm w-full">
                            Resolve Prices via TMF620
                        </button>
                    </div>
                </div>

                <h3 class="font-bold text-lg border-b pb-2 mb-4 mt-6">Product Offering Prices</h3>
                <div id="prices-list" class="space-y-3">
                    <div class="text-gray-500 italic">Fetch prices to see results.</div>
                </div>
            </div>
            <div id="empty-panel" class="flex-1 flex items-center justify-center text-gray-400">
                Please select a Product Offering from the list.
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
