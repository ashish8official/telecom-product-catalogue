<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogue Admin</title>
    <link rel="stylesheet" href="/assets/ui.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">PC</div>
            <div>
                <h1>Product Catalogue Admin</h1>
                <div class="small muted">Internal configuration console</div>
            </div>
        </div>
        <div class="spacer"></div>
        <div class="row" id="session-bar"></div>
        <a class="btn small" href="/viewer/" target="_blank" rel="noopener">Open TMF620 viewer ↗</a>
    </header>
    <div class="shell">
        <nav class="sidenav" id="nav" aria-label="Sections">
            <div class="group">Catalogue</div>
            <a href="#/catalogues" data-route="catalogues">Catalogues &amp; versions</a>
            <a href="#/simulator" data-route="simulator">Price simulator</a>
            <div class="group">Reference data</div>
            <a href="#/specifications" data-route="specifications">Specifications</a>
            <a href="#/markets" data-route="markets">Markets &amp; currencies</a>
            <a href="#/policies" data-route="policies">Policies</a>
            <a href="#/finance" data-route="finance">Tax &amp; GL</a>
            <a href="#/categories" data-route="categories">Categories</a>
        </nav>
        <main id="view" tabindex="-1"></main>
    </div>
    <script src="/assets/lib.js"></script>
    <script src="app.js"></script>
</body>
</html>
